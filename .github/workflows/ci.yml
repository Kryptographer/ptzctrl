name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per branch/PR: a new push cancels the previous, still-running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The tests need onnxruntime-web only: no Electron, no ffmpeg binary,
      # no camera. --ignore-scripts skips ffmpeg-static's binary download.
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Run tests
        run: npm test
