name: Feature request
description: Suggest something PTZ CTRL should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the feature — the shooting setup, the room, the workflow.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like PTZ CTRL to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other software, a hardware controller you're trying to replace.
